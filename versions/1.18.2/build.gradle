def javaVersion = project.java_version as int

subprojects {
	version = rootProject.version
	group = rootProject.group

	plugins.withId('java') {
		base {
			archivesName = "${archives_name}-${project.name}-${minecraft_version}"
		}

		java {
			toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
			withSourcesJar()
		}

		sourceSets {
			main {
				java.srcDir(rootProject.file('common/src/main/java'))
				resources.srcDir(rootProject.file('common/src/main/resources'))
			}
			test {
				java.srcDir(rootProject.file('common/src/test/java'))
			}
		}

		tasks.withType(JavaCompile).configureEach {
			options.encoding = 'UTF-8'
			options.release = javaVersion
		}

		dependencies {
			testImplementation platform("org.junit:junit-bom:${project.junit_version}")
			testImplementation 'org.junit.jupiter:junit-jupiter'
			testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
		}

		test {
			useJUnitPlatform()
		}

		jar {
			from(rootProject.file('../../LICENSE')) {
				rename { "${it}_${mod_id}" }
			}
		}

		processResources {
			var properties = [
					'version'               : project.version,
					'mod_id'                : mod_id,
					'mod_name'              : mod_name,
					'mod_author'            : mod_author,
					'description'           : mod_description,
					'fabric_loader_version' : fabric_loader_version,
					'java_version'          : java_version,
			]
			inputs.properties(properties)
			filesMatching('fabric.mod.json') {
				expand(properties)
			}
		}
	}
}

apply plugin: 'java-base'
def forgeJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(project.java_version as int) }
def forgeBuild = tasks.register('forgeBuild', Exec) {
	group = 'build'
	description = 'Builds the Forge jar with its own Gradle build in forge/.'
	workingDir = file('forge')
	def windows = System.getProperty('os.name').toLowerCase().contains('windows')
	commandLine = windows ? ['cmd', '/c', 'gradlew.bat', 'build', '--no-daemon', '-q'] : ['./gradlew', 'build', '--no-daemon', '-q']
	doFirst {
		environment('JAVA_HOME', forgeJava.get().metadata.installationPath.asFile.absolutePath)
	}
}

tasks.named('build') {
	dependsOn(forgeBuild)
}

tasks.register('dist', Sync) {
	group = 'build'
	description = 'Collects the jars for every mod loader in build/dist.'
	dependsOn(forgeBuild)
	dependsOn('fabric:assemble')
	from(project(':fabric').layout.buildDirectory.dir('libs')) {
		include("${archives_name}-fabric-${minecraft_version}-${version}.jar")
	}
	from('forge/build/libs') {
		include("${archives_name}-forge-${minecraft_version}-${version}.jar")
	}
	into(layout.buildDirectory.dir('dist'))
}
